# rerouted with rerouted-keyd: the server keys stay in rerouted-keyd, which signs for it.
# Install as /etc/systemd/system/rerouted.service.d/keyd.conf (deploy/README.md).
[Unit]
Requires=rerouted-keyd.socket
After=rerouted-keyd.socket

[Service]
Environment=REROUTED_KEYD=/run/rerouted-keyd/keyd.sock
