# rerouted with rerouted-sfu: voice channels' SFU runs there, and rerouted keeps no UDP
# media of its own. Install as /etc/systemd/system/rerouted.service.d/20-sfu.conf
# (deploy/README.md).
[Unit]
Requires=rerouted-sfu.socket
After=rerouted-sfu.socket

[Service]
Environment=REROUTED_SFU=/run/rerouted-sfu/sfu.sock
# Netlink was for the SFU, to find this host's addresses.
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
