# rerouted without a network: systemd passes it its listening socket (rerouted.socket), and
# rerouted-egress makes its connections out. Install as
# /etc/systemd/system/rerouted.service.d/30-egress.conf (deploy/README.md). With communities,
# run voice channels in rerouted-sfu too (20-sfu.conf): the SFU needs a network.
[Unit]
Requires=rerouted.socket rerouted-egress.socket
After=rerouted.socket rerouted-egress.socket

[Service]
Environment=REROUTED_EGRESS=/run/rerouted-egress/egress.sock
PrivateNetwork=true
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX
