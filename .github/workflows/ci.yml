name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commits, with the release in a comment: a tag can be moved, a commit
# can't. Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Build with the test clock
        run: go build -tags rerouted_testclock ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          install-go: false
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  # Each fuzz target for a minute: what arrives from the network (JSON, signed envelopes,
  # composite keys, WebSocket frames, chain entries) and rerouted-keyd's requests. go test
  # above already runs their seeds, and any input saved under testdata/fuzz.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ./internal/wire FuzzIJSON
          - ./internal/wire FuzzDecodeSigned
          - ./internal/wire FuzzCompositePublicKey
          - ./internal/ws FuzzRead
          - ./internal/chain FuzzApply
          - ./internal/cchain FuzzCommunityOps
          - ./internal/cchain FuzzCommunityEntry
          - ./internal/keyd FuzzKeydRequest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fuzz
        run: |
          set -- ${{ matrix.target }}
          go test -run '^$' -fuzz "^$2\$" -fuzztime 60s "$1"
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-${{ strategy.job-index }}
          path: internal/*/testdata/fuzz
